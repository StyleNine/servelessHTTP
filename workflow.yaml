main:
  params: [args]
  steps:
    - init_variables:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - topic_dlq: "topico-dead-letter"
          - run_service_url: "https://seu-servico-cloud-run-XXXXX.a.run.app" # Substitua pela sua URL

    - call_chuck_norris_service:
        try:
          call: http.get
          args:
            url: ${run_service_url}
            auth:
              type: OIDC # Autenticação segura sem expor chaves no código
            timeout: 10
          result: api_response
        retry:
          predicate: ${http.default_retry_predicate}
          max_retries: 3
          backoff:
            initial_delay: 2
            max_delay: 10
            factor: 2

    - check_response:
        switch:
          - condition: ${api_response.status == 200}
            next: process_success
        next: handle_failure

    - process_success:
        return:
          status: "SUCCESS"
          joke_content: ${api_response.body}

    - handle_failure:
        call: googleapis.pubsub.v1.projects.topics.publish
        args:
          topic: ${"projects/" + project_id + "/topics/" + topic_dlq}
          body:
            messages:
              - data: ${base64.encode(json.encode({"error": "Falha no processamento", "details": api_response}))}
        return:
          status: "FAILED_SENT_TO_DLQ"