main:
  params: [args]
  steps:
    - init_variables:
        assign:
          - execution_id: ${default(map.get(args, "idempotency_key"), sys.execution_id())}
          - target_service_url: ${sys.get_env("TARGET_SERVICE_URL")}
          - dlq_topic_project: ${sys.get_env("GCP_PROJECT_ID")}
          - dlq_topic_name: "topico-dlq-checkpoint3"

    # Passo principal envelopado com try/catch
    - execute_and_handle_errors:
        try:
          steps:
            - call_serverless_function:
                try:
                  call: http.get
                  args:
                    url: ${target_service_url}
                    headers:
                      X-Idempotency-Key: ${execution_id}
                    auth:
                      type: OIDC
                  result: function_response
                retry:
                  predicate: ${http.default_retry_predicate}
                  max_retries: 3
                  backoff:
                    initial_delay: 2
                    max_delay: 10
                    factor: 2

            - return_success:
                return:
                  status: "SUCCESS"
                  idempotency_key: ${execution_id}
                  payload: ${function_response.body}
        
        # Bloco catch posicionado como irmão do bloco try
        catch:
          exception: error_details
          steps:
            - prepare_dlq_payload:
                assign:
                  - error_payload:
                      execution_id: ${execution_id}
                      error_message: ${default(map.get(error_details, "message"), "Erro desconhecido")}
                      timestamp: ${sys.now()}
            
            - encode_dlq_payload:
                assign:
                  - encoded_data: ${base64.encode(json.encode(error_payload))}

            - publish_to_dlq:
                call: googleapis.pubsub.v1.projects.topics.publish
                args:
                  topic: ${"projects/" + dlq_topic_project + "/topics/" + dlq_topic_name}
                  body:
                    messages:
                      - data: ${encoded_data}

            - return_dlq_failure:
                return:
                  status: "FAILED"
                  idempotency_key: ${execution_id}
                  error: ${default(map.get(error_details, "message"), "Erro executando o fluxo")}
                  action: "Enviado para a Dead-Letter Queue (DLQ)"